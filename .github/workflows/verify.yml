name: Verify offline app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check storage, offline cache and install assets
        run: node --test tests/*.test.mjs tests/install-assets.cjs
      - name: Create self-contained deployment bundle
        run: node scripts/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: aquabears-offline-app
          path: dist/
          include-hidden-files: true
          retention-days: 5
